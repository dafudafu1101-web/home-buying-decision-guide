name: Ensure mobile result layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix mobile key result layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure mobile key result cards can stack
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="keyGrid" style="grid-template-columns:repeat(3,1fr)">'
          new = '<div class="keyGrid">'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit only when a correction was needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Mobile key result layout already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile key result layout"
          git push origin HEAD:main
