name: Verify code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const m = html.match(/<script>([\s\S]*)<\/script>/);
          if (!m) throw new Error('script block not found');
          fs.writeFileSync('/tmp/index-script.js', m[1]);
          NODE
          node --check /tmp/index-script.js
      - name: Run calculation regression tests
        run: node calculation-tests.js
      - name: Install browser smoke-test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser rendering smoke test
        run: |
          python3 -m http.server 4173 >/tmp/home-tool-http.log 2>&1 &
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            if(await page.locator('#out').isVisible()) throw new Error('results should be hidden before calculation');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
            if(overflow) throw new Error('mobile page has horizontal overflow');
            await page.click('#calcBtn');
            await page.waitForFunction(()=>getComputedStyle(document.querySelector('#out')).display!=='none');
            if(await page.locator('.actions').evaluate(el=>getComputedStyle(el).position)!=='static') throw new Error('mobile actions should stop being sticky after results render');
            for(const id of ['heroRFinal','heroBFinal','keyRMonth','keyBMonth','keyPrincipal','scenarioDown','scenarioFlat','scenarioUp']){
              const value=(await page.locator('#'+id).textContent()||'').trim();
              if(!value) throw new Error(id+' did not render');
            }
            const timeline=await page.locator('#timelineGrid .timelineCard').count();
            if(timeline<1) throw new Error('timeline did not render');
            if(errors.length) throw new Error('page errors: '+errors.join(' | '));
            await page.fill('#rentInitialCost','100');
            await page.locator('summary').filter({hasText:'その他の賃貸条件'}).click();
            await page.fill('#investRate','3');
            await page.click('#calcBtn');
            const invested=(await page.locator('#rentInvested').textContent()||'').trim();
            if(!invested) throw new Error('investment result did not render');
            await page.click('#resetBtn');
            if(await page.inputValue('#rentInitialCost')!=='0') throw new Error('reset failed');
            if(await page.locator('#out').isVisible()) throw new Error('reset should hide results');
            if(await page.locator('.actions').evaluate(el=>getComputedStyle(el).position)!=='sticky') throw new Error('mobile actions should become sticky again after reset');
            await browser.close();
            console.log('PASS: browser render/click/mobile/reset smoke test');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
