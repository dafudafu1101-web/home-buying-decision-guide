name: Verify code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const m = html.match(/<script>([\s\S]*)<\/script>/);
          if (!m) throw new Error('script block not found');
          fs.writeFileSync('/tmp/index-script.js', m[1]);
          NODE
          node --check /tmp/index-script.js
      - name: Run calculation regression tests
        run: node calculation-tests.js
      - name: Install browser smoke-test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser rendering smoke test
        run: |
          python3 -m http.server 4173 >/tmp/home-tool-http.log 2>&1 &
          node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            fs.mkdirSync('artifacts',{recursive:true});
            const browser=await chromium.launch({headless:true});

            const mobile=await browser.newPage({viewport:{width:390,height:844}});
            const mobileErrors=[];
            mobile.on('pageerror',e=>mobileErrors.push(String(e)));
            await mobile.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            if(await mobile.locator('#out').isVisible()) throw new Error('results should be hidden before calculation');
            if(await mobile.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error('mobile page has horizontal overflow');
            await mobile.click('#calcBtn');
            await mobile.waitForFunction(()=>getComputedStyle(document.querySelector('#out')).display!=='none');
            if(await mobile.locator('.actions').evaluate(el=>getComputedStyle(el).position)!=='static') throw new Error('mobile actions should stop being sticky after results render');
            for(const id of ['heroRFinal','heroBFinal','keyRMonth','keyBMonth','keyPrincipal','keyHomeEquity','scenarioDown','scenarioFlat','scenarioUp','equityFinal']){
              const value=(await mobile.locator('#'+id).textContent()||'').trim();
              if(!value) throw new Error(id+' did not render');
            }
            const timeline=await mobile.locator('#timelineGrid .timelineCard').count();
            if(timeline<1) throw new Error('timeline did not render');
            for(const text of ['賃貸側の差額を運用した場合を見る','不動産価格の3シナリオを見る','詳細な計算結果を見る']){
              const d=mobile.locator('details').filter({hasText:text}).first();
              if(await d.getAttribute('open')!==null) throw new Error(text+' should be collapsed by default');
            }
            if(mobileErrors.length) throw new Error('mobile page errors: '+mobileErrors.join(' | '));
            await mobile.screenshot({path:'artifacts/mobile-result.png',fullPage:true});
            await mobile.fill('#rentInitialCost','100');
            await mobile.locator('summary').filter({hasText:'その他の賃貸条件'}).click();
            await mobile.fill('#investRate','3');
            await mobile.click('#calcBtn');
            const invested=(await mobile.locator('#rentInvested').textContent()||'').trim();
            if(!invested) throw new Error('investment result did not render');
            await mobile.click('#resetBtn');
            if(await mobile.inputValue('#rentInitialCost')!=='0') throw new Error('reset failed');
            if(await mobile.locator('#out').isVisible()) throw new Error('reset should hide results');
            if(await mobile.locator('.actions').evaluate(el=>getComputedStyle(el).position)!=='sticky') throw new Error('mobile actions should become sticky again after reset');

            const desktop=await browser.newPage({viewport:{width:1280,height:900}});
            const desktopErrors=[];
            desktop.on('pageerror',e=>desktopErrors.push(String(e)));
            await desktop.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            if(await desktop.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error('desktop page has horizontal overflow');
            await desktop.click('#calcBtn');
            await desktop.waitForFunction(()=>getComputedStyle(document.querySelector('#out')).display!=='none');
            const heroBox=await desktop.locator('#resultTop').boundingBox();
            if(!heroBox||heroBox.width<800) throw new Error('desktop result headline is unexpectedly narrow');
            if(desktopErrors.length) throw new Error('desktop page errors: '+desktopErrors.join(' | '));
            await desktop.screenshot({path:'artifacts/desktop-result.png',fullPage:true});

            await browser.close();
            console.log('PASS: browser render/click/mobile/desktop/reset UX smoke test');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
