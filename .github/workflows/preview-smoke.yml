name: Preview smoke test

on:
  push:
    branches:
      - feat/lifeplan-cta-20260925
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render API locally
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const handler = require('./api/stress-test.js');
          let body=''; let status=0; const headers={};
          const res={
            set statusCode(v){status=v}, get statusCode(){return status},
            setHeader(k,v){headers[k]=v},
            end(v){body=String(v||'')}
          };
          handler({},res);
          console.log('local_status='+status);
          console.log('warnings='+(headers['X-Stress-Test-Warnings']||'none'));
          if(status!==200){console.error(body); process.exit(1)}
          if(headers['X-Stress-Test-Warnings']) process.exit(4);
          if(!body.includes('<details class="loanHelpFold">')) process.exit(2);
          if(!body.includes('id="loanConsultBtn"')) process.exit(3);
          if(!body.includes('class="moreSummary"')) process.exit(5);
          if(!body.includes('id="moreStressSummary"')) process.exit(6);
          require('fs').writeFileSync('local-page.html',body);
          NODE

      - name: Validate click notification API locally
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          global.fetch=async (_url,options)=>{
            const forwarded=JSON.parse(options.body);
            if(forwarded.kind!=='click'||forwarded.mode!=='lifeplan'||forwarded.source!=='result') throw new Error('unexpected forwarded click payload');
            return {ok:true,status:200,text:async()=>JSON.stringify({ok:true})};
          };
          const handler=require('./api/click-notification.js');
          const req={
            method:'POST',
            headers:{
              origin:'https://example.test',
              host:'example.test',
              'content-type':'application/json',
              'sec-fetch-site':'same-origin',
              'x-forwarded-for':'127.0.0.1'
            },
            body:{mode:'lifeplan',source:'result',price:12000,loanAmount:12840,zone:'バランス寄り',margin:'比較ラインまで ＋1,850万円',eventId:'smoke-lifeplan-1'},
            socket:{remoteAddress:'127.0.0.1'}
          };
          let body=''; let status=0;
          const res={set statusCode(v){status=v},get statusCode(){return status},setHeader(){},end(v){body=String(v||'')}};
          handler(req,res).then(()=>{
            if(status!==200) throw new Error('click API status '+status+' '+body);
            if(JSON.parse(body).ok!==true) throw new Error('click API response invalid');
            console.log('click notification API smoke passed');
          }).catch(err=>{console.error(err);process.exit(1)});
          NODE

      - name: Wait for preview and fetch page
        shell: bash
        run: |
          set -euo pipefail
          URL="https://home-buying-decision-guide-git-feat-li-1c96bc-dafudafu1101-7512.vercel.app/stress-test"
          ok=0
          for i in $(seq 1 8); do
            code=$(curl -sS -L -o page.html -w '%{http_code}' "$URL" || true)
            echo "attempt=$i status=$code"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo '--- response body ---'
            cat page.html || true
            exit 1
          fi

      - name: Validate rendered HTML
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'ページの読み込みに失敗しました。' page.html
          grep -q '<title>3分 住宅予算の決め方チェック｜ADCAST</title>' page.html
          grep -q 'loanHelpFold' page.html
          grep -q '住宅ローン、いくらまで借りられる？' page.html
          grep -q '物件価格だけ借りる' page.html
          grep -q '諸費用まで借りる' page.html
          grep -q 'id="loanConsultBtn"' page.html
          grep -q 'id="ctaBtn"' page.html
          grep -q 'id="agentBtn"' page.html
          grep -q 'class="moreSummary"' page.html
          grep -q '計算の内訳を見る' page.html

      - name: Validate key ordering
        shell: python
        run: |
          from pathlib import Path
          html = Path('page.html').read_text(encoding='utf-8')
          price = html.index('id="loanFromPrice"')
          total = html.index('id="loanFromTotal"')
          fold = html.index('class="loanHelpFold"')
          assert price < fold and total < fold, 'loan amount choices must appear before loan consultation fold'
          assert '<details class="loanHelpFold">' in html
          print('preview smoke test passed')

      - name: Install browser smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Validate live browser interactions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const URL='https://home-buying-decision-guide-git-feat-li-1c96bc-dafudafu1101-7512.vercel.app/stress-test';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const clickEvents=[];
            await page.route('**/api/click-notification',async route=>{
              clickEvents.push(route.request().postDataJSON());
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true})});
            });
            const response=await page.goto(URL,{waitUntil:'domcontentloaded',timeout:30000});
            if(!response || response.status()!==200) throw new Error('preview status '+(response&&response.status()));
            if((await page.locator('body').innerText()).includes('ページの読み込みに失敗しました。')) throw new Error('error page rendered');
            await page.locator('#start').click();
            await page.locator('#loanFromPrice').waitFor({state:'visible'});
            const fold=page.locator('details.loanHelpFold');
            if(await fold.getAttribute('open')!==null) throw new Error('loan fold must start closed');
            await fold.locator('summary').click();
            if(await fold.getAttribute('open')===null) throw new Error('loan fold did not open');
            await page.locator('#loanConsultBtn').click();
            await page.locator('#handoffOverlay.show').waitFor({state:'visible'});
            if(!(await page.locator('#handoffTitle').innerText()).includes('ローン')) throw new Error('loan modal did not open');
            await page.waitForFunction(()=>sessionStorage.getItem('housing_cta_notified_loan')==='1');
            if(!clickEvents.some(e=>e.mode==='loan'&&e.source==='step2')) throw new Error('loan click notification missing');
            await page.locator('#handoffClose').click();

            await page.locator('#age').fill('35');
            await page.locator('#children').fill('0');
            await page.locator('#grossIncome').fill('1700');
            await page.locator('#cash').fill('2000');
            await page.locator('#investments').fill('0');
            await page.locator('#price').fill('12000');
            await page.locator('#loanAmount').fill('12840');
            await page.locator('#living').fill('35');
            await page.locator('#next').click();
            await page.locator('.screen[data-step="3"].active').waitFor({state:'visible'});

            const more=page.locator('details.moreWrap');
            if(await more.getAttribute('open')!==null) throw new Error('detail accordion must start closed');
            for(const id of ['#moreStressSummary','#moreBalanceSummary','#moreNetWorthSummary']){
              const value=(await page.locator(id).innerText()).trim();
              if(!value || value==='—') throw new Error('summary metric not populated: '+id);
            }
            const summaryText=await more.locator('summary').innerText();
            if(!summaryText.includes('計算の内訳を見る')) throw new Error('new detail summary missing');
            await more.locator('summary').click();
            if(await more.getAttribute('open')===null) throw new Error('detail accordion did not open');
            await page.locator('#stressCards .detailCard').first().waitFor({state:'visible'});
            await page.locator('#netWorthList .netWorthCard').first().waitFor({state:'visible'});

            const fontChecks=[
              ['.moreWrap .moreBlock h2','h2'],
              ['.netWorthCard .nwFinal','net worth'],
              ['.strategyPrice','strategy price']
            ];
            for(const [selector,label] of fontChecks){
              const value=await page.locator(selector).first().evaluate(el=>window.getComputedStyle(el).fontFamily);
              if(/Mincho|Georgia/i.test(value)) throw new Error('unexpected serif font '+label+': '+value);
            }

            await page.evaluate(()=>document.querySelector('#ctaBtn').click());
            await page.locator('#handoffOverlay.show').waitFor({state:'visible'});
            if(!(await page.locator('#handoffTitle').innerText()).includes('ライフプラン')) throw new Error('lifeplan modal did not open');
            await page.waitForFunction(()=>sessionStorage.getItem('housing_cta_notified_lifeplan')==='1');
            if(!clickEvents.some(e=>e.mode==='lifeplan')) throw new Error('lifeplan click notification missing');
            await page.locator('#handoffClose').click();
            await page.evaluate(()=>document.querySelector('#agentBtn').click());
            await page.locator('#handoffOverlay.show').waitFor({state:'visible'});
            if(!(await page.locator('#handoffTitle').innerText()).includes('物件')) throw new Error('property modal did not open');
            await page.waitForFunction(()=>sessionStorage.getItem('housing_cta_notified_property')==='1');
            if(!clickEvents.some(e=>e.mode==='property')) throw new Error('property click notification missing');
            if(new Set(clickEvents.map(e=>e.mode)).size!==3) throw new Error('expected exactly three CTA notification types');
            console.log('live browser interaction smoke test passed');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
