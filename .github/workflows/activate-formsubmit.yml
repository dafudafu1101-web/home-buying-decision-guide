name: Activate consultation relay

on:
  push:
    branches:
      - fix/consultation-mail-client
    paths:
      - .github/workflows/activate-formsubmit.yml

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger one-time FormSubmit activation
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST 'https://formsubmit.co/ajax/d.sakai@ad-cast.co.jp' \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode '_subject=住宅予算チェック送信機能の初期設定' \
            --data-urlencode '_captcha=false' \
            --data-urlencode 'お名前=送信機能テスト' \
            --data-urlencode 'メールアドレス=d.sakai@ad-cast.co.jp' \
            --data-urlencode '相談種別=初期設定テスト' \
            --data-urlencode '診断結果・相談内容=住宅予算チェックのブラウザ送信機能を有効化するための初回テストです。'
